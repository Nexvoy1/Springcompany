<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artist — Springcompany</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root{--bg:#0A0A0F;--bg2:#111118;--text:#F0EEF8;--muted:#8A87A0;--gold:#D4AF37}
    body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
    header{height:72px;display:flex;align-items:center;gap:16px;padding:0 24px;background:rgba(0,0,0,0.6);position:sticky;top:0}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
    .logo img{height:38px;border-radius:8px}
    main{max-width:1100px;margin:28px auto;padding:0 20px}
    .profile-hero{height:420px;background-size:cover;background-position:center;border-radius:12px;position:relative}
    .profile-card{display:grid;grid-template-columns:320px 1fr;gap:28px;margin-top:-80px}
    .profile-left{background:rgba(255,255,255,0.03);padding:18px;border-radius:12px}
    .profile-img{height:320px;background-size:cover;background-position:center;border-radius:8px}
    .booking-form{background:rgba(255,255,255,0.03);padding:16px;border-radius:8px}
    .btn-book{display:inline-block;padding:12px 18px;background:var(--gold);color:#000;border-radius:8px;text-decoration:none;font-weight:700}
    footer{padding:28px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">
      <img src="img/logo.png" alt="logo">
      <strong>Springcompany</strong>
    </a>
  </header>
  <main>
    <div id="hero" class="profile-hero"></div>
    <div id="profile" class="profile-card">
      <div class="profile-left">
        <div id="pimg" class="profile-img"></div>
        <div id="pinfo"></div>
      </div>
      <div class="profile-right">
        <h1 id="pname"></h1>
        <div id="pmeta" style="color:var(--muted);margin-bottom:12px"></div>
        <p id="pbio" style="line-height:1.6;color:var(--muted)"></p>
        <div style="margin-top:18px">
          <a id="bookBtn" class="btn-book" href="#">Book This Artist</a>
        </div>
      </div>
    </div>
  </main>
  <footer>
    © SPRING COMPANY
  </footer>

  <script>
  // Minimal CELEBRITIES dataset extracted from index page for profile rendering
  var CELEBRITIES = window.__CELEBS__ || [];
  function qs(name){
    var u = new URL(location.href);
    return u.searchParams.get(name);
  }
  function render(id){
    var c = CELEBRITIES.find(function(x){return String(x.id)===String(id)});
    if(!c){ document.getElementById('profile').innerHTML='<p style="color:var(--muted)">Artist not found.</p>'; return }
    document.getElementById('hero').style.backgroundImage = "url('"+c.img+"')";
    document.getElementById('pimg').style.backgroundImage = "url('"+c.img+"')";
    document.getElementById('pname').textContent = c.name;
    document.getElementById('pmeta').textContent = c.occ + ' • ' + c.nation + ' • ' + (c.years||'') ;
    document.getElementById('pbio').textContent = c.bio || '';
    var book = document.getElementById('bookBtn');
    book.href = '/book-now.html?artist_id=' + c.id;
  }
  // if parent index has window.CELEBRITIES, use it; else try to fetch from index.html
  (function(){
    if (window.opener && window.opener.CELEBRITIES) { window.__CELEBS__ = window.opener.CELEBRITIES; }
    else if (window.CELEBRITIES) { window.__CELEBS__ = window.CELEBRITIES; }
    else {
      // attempt to load CELEBRITIES from index.html script by fetching and extracting
      fetch('/frontend/index.html').then(function(r){return r.text()}).then(function(t){
        var m = t.match(/var CELEBRITIES = (\[.*?\]);/s);
        if(m){ try{ window.__CELEBS__ = JSON.parse(m[1]); }catch(e){}
        }
      }).finally(function(){ render(qs('id')||qs('artist_id')||qs('celeb')||''); });
      return;
    }
    render(qs('id')||qs('artist_id')||qs('celeb')||'');
  })();
  </script>
</body>
</html>
